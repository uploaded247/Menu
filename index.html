<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css" />
    <title>Menu</title>
</head>

<body>
    <section class="menu">
        <!-- tittle -->
        <div class="tittle">
            <h2>Our Menu</h2>
            <div class="underline"></div>
        </div>
        <!-- filter buttton -->
        <div class="btn-container">
            <button class="filter-btn" type="buttton" data-id="All">All</button>
            <button class="filter-btn" type="buttton" data-id="Shakes">Shakes</button>
            <button class="filter-btn" type="buttton" data-id="Breakfast">Breakfast</button>
            <button class="filter-btn" type="buttton" data-id="Lunch">Lunch</button>
        </div>
        <!-- menu items -->
        <div class="section-center">
            <!-- single items -->
            <article class="menu-item">
                <div>
                    <img src="./images/apple.jfif" class="photo" alt="menu item">
                </div>
                <div class="item-info">
                    <header>d
                        <h4>Apple Juice</h4>
                        <h4 class="price">$15</h4>
                    </header>
                    <p class="item-text">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Qui necessitatibus
                        esse ipsa labore reprehenderit nam perspiciatis aliquam quae possimus placeat.</p>
                </div>
            </article>
            <!-- end of single item -->
        </div>
    </section>
    <!-- java script -->
    <script src="/app.js"></script>
</body>

</html>
